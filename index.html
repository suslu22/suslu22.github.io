<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">

  <meta name="color-scheme" content="light dark">

  <div class="stage">

      <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
      <i class="lines"></i>
    </div>

    <header class="top">
      <div class="wrap top-in">
        <a class="brand" href="./" aria-label="suslu22 ana sayfa">
          <img src="assets/icons/favicon.svg" alt="" width="40" height="40">

        <button class="theme" type="button" id="theme">
          <span class="theme-ico" aria-hidden="true"></span>
          <span class="theme-txt">Koyu tema</span>
        </button>
      </div>

    <section class="hero wrap" aria-labelledby="baslik">
      <div class="hero-text">
        <h1 id="baslik">suslu22</h1>
        <p class="hero-actions">
          <a class="hbtn solid" href="#projeler">Projelere git <span aria-hidden="true">↓</span></a>

    <div class="wrap foot-in">
      <p>© <span id="year">2026</span> suslu22</p>
      <p><a class="plain" href="https://github.com/suslu22/suslu22.github.io" rel="noopener">Bu sayfanın kaynağı</a></p>

  <script src="assets/app.js"></script>
